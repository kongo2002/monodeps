resolution: 'workspace'

dependencies:
  # this dependency must be ignored because tagged to a specific version
  tagged_flutter:
    git:
      url: https://github.com/kongo2002/monodeps.git
      tag_pattern: v{{version}}
      path: tagged-flutter-lib/
    version: ^2.0.1
  # this dependency must be included
  flutter_lib:
    git:
      url: https://github.com/kongo2002/monodeps.git
      path: flutter-lib/
  shared_code:
    git:
      url: https://github.com/kongo2002/monodeps.git
      path: shared
  not_shared_code:
    git:
      url: https://github.com/different/repo.git
      path: service-c

dependency_overrides:
  some_lib:
    path: ../libs/some_lib

flutter:
  assets:
    - ../directory/

fonts:
  - family: Raleway
    fonts:
      - asset: ../fonts/Raleway.ttf
